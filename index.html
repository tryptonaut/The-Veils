<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VEIL // First Light</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="crosshair">✦</div>

  <div id="hud">
    <div class="title">VEIL // FIRST LIGHT</div>
    <div class="subtitle">Cosmic Void Prototype</div>
    <div class="hint">Tap to enter • WASD move • Mouse look • Space jump • Shift sprint</div>
  </div>

  <div id="mobileControls">
    <div id="stickBase">
      <div id="stick"></div>
    </div>
    <button id="jumpBtn">JUMP</button>
    <button id="sprintBtn">SPRINT</button>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="main.js"></script>
</body>
</html>
